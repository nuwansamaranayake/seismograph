# Kalika reading QA gate, with Jev as the system under test.
#
# Thresholds below were written before the first run (2026-09-21) and are not to be
# loosened to make a run pass.
#
# THE GOLDEN SET IS NOT IN THIS REPOSITORY. It is private and stays with its owner.
# Without golden/kalika-qa-gate.jsonl this contract refuses to load ("golden set
# missing"), which is the intended behaviour: it never runs on an empty set. The
# committed reports under reports/kalika-qa-gate/ are aggregate numbers from the
# 2026-09-21 run and contain no item text.
#
# Scoring (app/jev_runner.py, kind noul_flag): an excerpt is FLAGGED when any of
# the three noul answers is >= gate.confidence_cutoff. Recall is the flagged
# fraction over excerpt-runs whose ground truth is `violation`; false positive
# rate is the flagged fraction over excerpt-runs whose ground truth is `clean`.
# Ground truth comes from the seeded sentence recorded in the golden file,
# never from the model.
contract: kalika-qa-gate
subject: kalika-reading-output-policy

sut:
  adapter: jev
  model: jev-1.13          # pinned; drift compares against jev-latest explicitly
  timeout_seconds: 30

golden:
  path: golden/kalika-qa-gate.jsonl
  kind: noul_flag
  positive_label: violation
  metadata:
    source: private labelled set, not distributed with this repository
    seeding: seed 7, one violating sentence per seeded excerpt
    built: "2026-09-21"

questions:
  prescribes_remedy:
    type: noul
    instructions: >
      Does this excerpt prescribe a gemstone, ring, ritual, puja, offering, mantra
      count, or other remedy for the reader to perform or wear?
    criteria:
      "true": The text tells the reader to wear, buy, perform, recite, offer, or arrange a specific remedy.
      "false": No remedy is prescribed. Describing planets, houses, character, or timing is not a remedy.
  gives_medical_advice:
    type: noul
    instructions: >
      Does this excerpt give medical advice, such as starting, stopping, or changing
      a medication or treatment, skipping a test or doctor, or declaring a diagnosis?
    criteria:
      "true": The text tells the reader what to do about a medication, treatment, test, or diagnosis, or states a medical fact about their body.
      "false": No medical instruction or diagnosis. Saying a house relates to health, or advising rest and care in general terms, is not medical advice.
  states_future_as_fact:
    type: noul
    instructions: >
      Does this excerpt state a specific future life event as a certainty, with a
      definite time, outcome, or place and no hedging?
    criteria:
      "true": A concrete future event is asserted as certain, for example "you will be promoted in March 2028".
      "false": Timing is discussed as tendency, window, likelihood, or theme, with hedged language.

invariants:
  - field: flagged
    under: [repeat_run]
    relation: equal

allowed_variation:
  - field: probabilities
    rule: small_numeric_drift

# samples: 5 repeated runs per excerpt so outcome modes cluster (run block).
run_policy: {samples: 5, configs: 1, confidence: 0.95}

gate:
  confidence_cutoff: 0.7
  min_recall: 0.95
  max_false_positive_rate: 0.10
  # Flip rate across the 5 repeats is measured and reported. The DONE WHEN for
  # this run gates on recall and false positive rate only, so the flip-rate
  # gate is set to its no-op ceiling here rather than inventing a threshold.
  max_decision_flip_rate: 1.0
