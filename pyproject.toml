[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seismograph"
version = "0.4.0"
description = "An AI eval system for measuring LLM performance consistency (statistical process control)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Nuwan Samaranayake" }]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "alembic",
    "redis",
    "httpx",
    "aignite-groundwork @ git+https://github.com/nuwansamaranayake/groundwork@v0.2.0",
    "numpy",
    "scipy",
    "scikit-learn",
    "pyyaml",
    # app/checks.py: the `assert` check type validates against a real JSON Schema.
    # Hand-rolling a subset validator here would be a second, weaker implementation
    # of a solved problem living inside a gate.
    "jsonschema",
    # app/ephemeris.py: the independent second opinion the g3 engine layer checks
    # the Kalika calculator against. MIT, reading a JPL DE kernel. pyswisseph is
    # the obvious alternative and is AGPL-3.0, whose network clause does not fit a
    # hosted service (DECISION D-7-3).
    "skyfield",
    # zoneinfo needs a tz database; Windows and slim containers ship without one.
    "tzdata",
    # app/jev.py: TypeSafe System One (Jev) as a system under test, reached through
    # OpenRouter by base URL. The SDK builds the request body; nothing is hand-rolled.
    "typesafe-sdk>=0.7.1",
]

# sentence-transformers (and its CUDA torch) is deliberately NOT declared: no Phase 1
# code imports it. Embeddings go through app/engine/embedding.py (deterministic
# HashingEmbedder, or OpenRouterEmbedder over HTTP). Re-add it in the phase that
# actually imports it (e.g. a local NLI cross-encoder), not before.

[project.optional-dependencies]
# pytest-cov, mypy and the yaml stubs: scripts/quality.py measures coverage and types.
dev = ["pytest", "pytest-cov", "ruff", "mypy", "types-PyYAML"]

# The deploy-pipeline command (docs/gates-spec.md g4):
#   seismo run --suite kalika --profile daily --fail-on drift
[project.scripts]
seismo = "app.cli:main"

[tool.setuptools.packages.find]
# Found, not listed. An explicit `packages = ["app", "seismograph"]` ships those two
# directories and none of their subpackages, so a non-editable install had no app.engine
# and `seismo` crashed on import everywhere except a source checkout.
# `seismograph` is a two-line shim so `python -m seismograph` runs app.cli:main.
include = ["app*", "seismograph*"]

[tool.setuptools.package-data]
app = ["static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pin the ruleset explicitly: CI installs latest ruff, and default-select churn between
# ruff releases must not be able to redefine what "lint passes" means for this repo.
# B (bugbear), I (import order), UP (modern syntax) and SIM (simplify) joined in Phase 2,
# when scripts/quality.py made lint a measured component with a floor.
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM"]
# UP042 would turn the str+Enum classes in the contract language into StrEnum, which
# changes what str(member) returns. Not a syntax upgrade, a behaviour change.
ignore = ["UP042"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
files = ["app"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
