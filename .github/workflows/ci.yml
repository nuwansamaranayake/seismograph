name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  web:
    name: "web (lint, types, tests, build)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      # vitest.config.ts carries the 96% coverage thresholds: a drop fails this step.
      - run: npm test
      - run: npm run build

  quality:
    name: "quality gate (required)"
    runs-on: ubuntu-latest
    # Nine measured components, every one at or above 96, or the build fails.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/cache@v4
        with:
          path: data/ephemeris
          key: jpl-de421
      - name: Fetch the ephemeris kernel the reference tests read
        run: python scripts/fetch_ephemeris.py
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: python scripts/quality.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: |
            quality_report.md
            quality_report.json

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install app (groundwork resolves from the ref pyproject pins)
        # No fallbacks: a dependency-resolution failure must fail THIS step loudly, not
        # resurface later as ModuleNotFoundError in pytest (silent-fallback anti-pattern).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # The ephemeris reference tests read a 17 MB JPL kernel that is not in the repository.
      # Fetch it as a named, cached step: left implicit, pytest downloaded it silently and a
      # network failure showed up as 83 unrelated-looking test errors.
      - uses: actions/cache@v4
        with:
          path: data/ephemeris
          key: jpl-de421
      - name: Fetch the ephemeris kernel the reference tests read
        run: python scripts/fetch_ephemeris.py
      - run: pytest

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env for compose (gitignored; CI uses the committed example)
        run: cp .env.example .env
      - name: Bring up the stack
        run: docker compose up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "service did not become healthy" && docker compose logs && exit 1
      - name: Smoke against a real business endpoint
        run: |
          pip install httpx
          # token must match SMOKE_TEST_TOKEN in .env.example (the container's env in CI)
          API_HOST=127.0.0.1 API_PORT=8000 SMOKE_TEST_TOKEN=dev-smoke-token python scripts/smoke_test.py
      - name: Teardown
        if: always()
        run: docker compose down -v

  eval:
    name: "eval (required)"
    runs-on: ubuntu-latest
    # Golden-defect suite against the EVAL.md thresholds. Deterministic (fixed seeds,
    # hashing embedder), keyless, and REQUIRED: a miss on any bound fails the build.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pydantic>=2" pyyaml httpx
      - run: python scripts/eval.py
